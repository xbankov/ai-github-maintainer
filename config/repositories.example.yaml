# AI GitHub Maintainer — repository configuration.
# Copy to config/repositories.yaml and adjust. Contains no secrets:
# credentials come from environment variables (see .env.example).
# Adding a repository = adding an entry here + installing the GitHub App on it.

repositories:
  - id: songbook
    owner: xbankov
    name: songbook
    enabled: true
    default_branch: main
    max_concurrent_tasks: 1
    # Commands run inside the task worktree (Milestone 3). Empty list = not applicable.
    commands:
      test: ["./.ai/validate.sh"]
      lint: []
      build: []
      format: []
      typecheck: []
    opencode: {} # optional: analysis_agent, implementation_agent, model
    instructions: |
      Follow AGENTS.md in the repository root.

  - id: home-server
    owner: xbankov
    name: home-server
    enabled: true
    default_branch: main
    max_concurrent_tasks: 1
    commands:
      test: ["scripts/compose-validate.sh $(find services -name 'compose.y*ml')"]
      lint: []
      build: []
      format: []
      typecheck: []
    opencode: {}
    instructions: |
      Follow AGENTS.md in the repository root. Never run staging on this host.

github:
  # Maintainers: may add the allowed label and use /ai approve, /ai reject, /ai revise.
  authorized_users:
    - xbankov
    - VladoBaca
  # An issue is processed only after a maintainer adds this label.
  allowed_label: ai:allowed
  # Issues the AI opens itself (feature proposals); a maintainer adds ai:allowed to work on one.
  proposal_label: ai:proposal

discovery:
  schedule: "0 8 * * *"
  timezone: Europe/Berlin
  # Polling replaces webhooks: GitHub is checked this often.
  poll_interval_seconds: 300
  # Issues in progress (being analysed or waiting for approval) per repository.
  issue_batch_size: 1
  feature_suggestions: 3

opencode:
  # The orchestrator container reaches the host's OpenCode server through the Docker host gateway.
  server_url: http://host.docker.internal:4096
  analysis_agent: maintainer-plan
  implementation_agent: maintainer-build
  model: opencode-go/deepseek-v4.1-flash
  request_timeout_ms: 15000
  # The OpenCode web UI as you open it (LAN/WireGuard); used for session links on GitHub.
  web_url: http://192.168.178.50:4096
  # GitHub login credited for approvals made in OpenCode.
  operator: xbankov

limits:
  max_review_iterations: 5
  max_implementation_retries: 3
  max_concurrent_implementations: 1
  task_timeout_minutes: 60
  analysis_timeout_minutes: 15
  # Jobs running at the same time across all repositories (1 = one issue at a time).
  max_parallel_jobs: 1
  # CI runs in GitHub Actions on the bot's draft pull request.
  ci_timeout_minutes: 45
  ci_grace_minutes: 10
  # Notify the maintainer on GitHub after the session waited this long for input.
  input_wait_minutes: 30
